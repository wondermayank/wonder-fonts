<h1>WonderFonts by Wondermayank: free font pairing and design studio</h1>
<p>WonderFonts is a free font pairing and typography design studio by Wondermayank. Explore 1,892 Google Fonts, check pairing scores, start from templates and export PNG, SVG, PDF or CSS.</p>
<p>WonderFonts needs JavaScript to run the editor. Enable it and reload to start designing.</p>
<h2>What you can do</h2>
<ul><li>Search and preview 1,892 Google Fonts</li><li>Check a font pairing score</li><li>Start from 29 editable templates</li><li>Design posts, stories, thumbnails and posters</li><li>Export PNG, JPG, SVG, PDF or CSS, free and with no watermark</li></ul>
<h2>Design sizes</h2><ul><li>Instagram Post (1080 x 1080 px)</li><li>Instagram Portrait (1080 x 1350 px)</li><li>Story / Reel (1080 x 1920 px)</li><li>YouTube Thumbnail (1280 x 720 px)</li><li>X / LinkedIn Post (1200 x 675 px)</li><li>Blog / OG Image (1200 x 630 px)</li><li>Presentation 16:9 (1920 x 1080 px)</li><li>Poster (A-series) (1240 x 1754 px)</li><li>Business Card (1050 x 600 px)</li><li>Twitter / X Header (1500 x 500 px)</li></ul>
<h2>Questions</h2><h3>Is WonderFonts free?</h3><p>Yes. Every feature — all 1,800+ fonts, templates, the editor and every export format — is free. There is no account, no watermark and no paywall.</p><h3>Do I need to sign up or log in?</h3><p>No. Open the site and start designing. Your work is saved automatically in your own browser.</p><h3>How do I start a new design?</h3><p>Click “New design” in the top bar, pick a size (Instagram post, story, YouTube thumbnail, slide, poster and more) or enter a custom size. You can also open any template from the Templates page and edit it.</p><h3>Which formats can I export?</h3><p>PNG (1×, 2× or 4×, with optional transparent background), JPG, SVG with the fonts embedded, high-resolution PDF, and CSS with the font imports and text styles. Click Export in the top-right of the editor.</p><h3>Where are my designs saved?</h3><p>In your browser on this device (IndexedDB). Open “My Projects” to see them. Nothing is uploaded to a server.</p>
